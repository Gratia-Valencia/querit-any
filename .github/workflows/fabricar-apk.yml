name: 💌 Fabricar APK de Querit any

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Número de versión (por ejemplo 1.0)'
        required: true
        default: '1.0'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Coger el proyecto
        uses: actions/checkout@v5

      - name: ☕ Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Los ordenadores de GitHub ya traen Android instalado (ANDROID_HOME): no hace falta prepararlo.
      - name: 🤖 Comprobar Android
        run: |
          echo "Android en: $ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" | tail -3
          ls "$ANDROID_HOME/platforms" | tail -3

      - name: 🔐 Sacar la llave de firma de los secretos
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "❌ Falta el secreto KEYSTORE_BASE64"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > querit-any.keystore

      - name: 🔢 Poner el número de versión
        run: |
          CODE=${{ github.run_number }}
          sed -i "s/versionCode [0-9]*/versionCode $CODE/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ inputs.version }}\"/" app/build.gradle

      - name: 🛠️ Fabricar la app
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: ✍️ Firmar la app
        env:
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk alineada.apk
          "$BT/apksigner" sign --ks querit-any.keystore --ks-key-alias queritany --ks-pass env:PW --key-pass env:PW --out "Querit-any-${{ inputs.version }}.apk" alineada.apk
          "$BT/apksigner" verify "Querit-any-${{ inputs.version }}.apk"
          rm -f querit-any.keystore

      - name: 🚀 Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" "Querit-any-${{ inputs.version }}.apk" \
            --title "Querit any ${{ inputs.version }} 💌" \
            --notes "Descarga el archivo .apk de aquí abajo, ábrelo en tu móvil Android y dale a Instalar 💌 Tus fotos y tus días se quedan solo en tu móvil."
